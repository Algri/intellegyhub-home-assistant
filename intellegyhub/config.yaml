name: IntellegyHUB
slug: intellegyhub
description: IntellegyHUB hardware runtime for Home Assistant native entities
version: 0.5.144
stage: experimental
arch:
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:chip
hassio_api: true
hassio_role: manager
full_access: true
gpio: true
privileged:
  - SYS_RAWIO
devices:
  - /dev/gpiochip0
  - /dev/gpiomem
  - /dev/i2c-1
  - /dev/i2c-10
  - /dev/mem
  - /dev/vcio
map:
  - type: homeassistant_config
    read_only: false
    path: /ha_config
options:
  diagnostics:
    carrier_monitoring_poll_interval_seconds: 30
  onewire:
    bus1_poll_interval_seconds: 30
    bus2_poll_interval_seconds: 30
  power_button:
    shutdown_enabled: true
    shutdown_hold_seconds: 1.0
  buzzer:
    startup_enabled: false
    shutdown_enabled: true
    frequency: 2000
    duration_ms: 200
schema:
  diagnostics:
    carrier_monitoring_poll_interval_seconds: int(1,3600)
  onewire:
    bus1_poll_interval_seconds: int(1,3600)
    bus2_poll_interval_seconds: int(1,3600)
  power_button:
    shutdown_enabled: bool
    shutdown_hold_seconds: float(0.1,1.5)
  buzzer:
    startup_enabled: bool
    shutdown_enabled: bool
    frequency: int(20,2800)
    duration_ms: int(10,5000)
