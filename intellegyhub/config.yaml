name: IntellegyHUB
slug: intellegyhub
description: IntellegyHUB hardware runtime for Home Assistant native entities
version: 0.5.143
stage: experimental
arch:
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:chip
hassio_api: true
hassio_role: manager
full_access: true
gpio: true
privileged:
  - SYS_RAWIO
devices:
  - /dev/gpiochip0
  - /dev/gpiomem
  - /dev/i2c-1
  - /dev/i2c-10
  - /dev/mem
  - /dev/vcio
map:
  - type: homeassistant_config
    read_only: false
    path: /ha_config
options:
  carrier_monitoring_poll_interval_seconds: 30
  onewire_bus1_poll_interval_seconds: 30
  onewire_bus2_poll_interval_seconds: 30
  power_button_shutdown_enabled: true
  power_button_shutdown_hold_seconds: 1.0
  startup_buzzer_enabled: false
  startup_buzzer_frequency: 2000
  startup_buzzer_duration_ms: 200
  shutdown_buzzer_enabled: true
  shutdown_buzzer_frequency: 2000
  shutdown_buzzer_duration_ms: 200
  shutdown_buzzer_volume_percent: 50
schema:
  carrier_monitoring_poll_interval_seconds: int(1,3600)
  onewire_bus1_poll_interval_seconds: int(1,3600)
  onewire_bus2_poll_interval_seconds: int(1,3600)
  power_button_shutdown_enabled: bool
  power_button_shutdown_hold_seconds: float(0.1,1.5)
  startup_buzzer_enabled: bool
  startup_buzzer_frequency: int(20,2800)
  startup_buzzer_duration_ms: int(10,5000)
  shutdown_buzzer_enabled: bool
  shutdown_buzzer_frequency: int(300,2800)
  shutdown_buzzer_duration_ms: int(10,1000)
  shutdown_buzzer_volume_percent: int(0,100)
