network:
  8098/tcp: Внутрішній порт API
configuration:
  diagnostics:
    name: Діагностика
    description: Налаштування частоти оновлення даних про стан контролера.
    fields:
      carrier_monitoring_poll_interval_seconds:
        name: Інтервал опитування, секунди
        description: Як часто оновлюються дані про лінії живлення, несправності живлення та температуру плати.
      ste_heartbeat_on_seconds:
        name: Час світіння STE, секунди
        description: Як довго індикатор STE залишається ввімкненим у кожному циклі пульсації.
      ste_heartbeat_off_seconds:
        name: Час паузи STE, секунди
        description: Як довго індикатор STE залишається вимкненим у кожному циклі пульсації.
  onewire:
    name: 1-Wire
    description: Налаштування опитування температурних датчиків на двох шинах 1-Wire.
    fields:
      bus1_poll_interval_seconds:
        name: Інтервал опитування шини 1, секунди
        description: Як часто оновлюються показники температурних датчиків на шині 1-Wire 1.
      bus2_poll_interval_seconds:
        name: Інтервал опитування шини 2, секунди
        description: Як часто оновлюються показники температурних датчиків на шині 1-Wire 2.
  rs485:
    name: RS-485
    description: Налаштування інтерфейсів RS-485.
    fields:
      enabled:
        name: Увімкнено
        description: Увімкнути інтерфейси RS-485.
  power_button:
    name: Кнопка живлення
    description: Налаштування коректного завершення роботи хоста фізичною кнопкою живлення.
    fields:
      shutdown_enabled:
        name: Завершення роботи
        description: Дозволити коректне завершення роботи хоста фізичною кнопкою живлення.
      shutdown_hold_seconds:
        name: Час утримання, секунди
        description: Як довго потрібно утримувати кнопку живлення до початку завершення роботи.
  buzzer:
    name: Зумер
    description: Налаштування звукових сповіщень зумера на GPIO18.
    fields:
      startup_enabled:
        name: Звук під час запуску
        description: Подати короткий звуковий сигнал після запуску доповнення.
      shutdown_enabled:
        name: Звук під час завершення роботи
        description: Подати підтверджувальний звуковий сигнал перед завершенням роботи хоста. Гучність сигналу фіксована на рівні 80%.
      frequency:
        name: Частота, Гц
        description: Частота звукових сигналів під час запуску та завершення роботи.
      duration_ms:
        name: Тривалість, мс
        description: Тривалість звукових сигналів під час запуску та завершення роботи.
