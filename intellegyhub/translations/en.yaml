configuration:
  network:
    name: Network
    8098/tcp: Internal API port
  diagnostics:
    name: Diagnostics
    description: Configure how often controller health data is refreshed.
    carrier_monitoring_poll_interval_seconds:
      name: Polling interval, seconds
      description: How often voltage rails, power fault status, and board temperature are refreshed.
  onewire:
    name: 1-Wire
    description: Configure temperature polling for the two 1-Wire buses.
    bus1_poll_interval_seconds:
      name: Bus 1 polling interval, seconds
      description: How often temperature sensors on 1-Wire Bus 1 are refreshed.
    bus2_poll_interval_seconds:
      name: Bus 2 polling interval, seconds
      description: How often temperature sensors on 1-Wire Bus 2 are refreshed.
  power_button:
    name: Power button
    description: Configure graceful host shutdown from the physical Power button.
    shutdown_enabled:
      name: Shutdown
      description: Enable graceful host shutdown from the physical Power button.
    shutdown_hold_seconds:
      name: Hold time, seconds
      description: How long the Power button must be held before shutdown starts.
  buzzer:
    name: Buzzer
    description: Configure GPIO18 buzzer notifications.
    startup_enabled:
      name: Startup buzzer
      description: Play a short beep after the add-on starts.
    shutdown_enabled:
      name: Shutdown buzzer
      description: Play a confirmation beep before host shutdown. Shutdown beep volume is fixed at 80%.
    frequency:
      name: Frequency, Hz
      description: Frequency used for startup and shutdown beeps.
    duration_ms:
      name: Duration, ms
      description: Duration used for startup and shutdown beeps.
