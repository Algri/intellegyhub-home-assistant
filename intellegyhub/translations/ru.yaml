network:
  8098/tcp: Внутренний порт API
configuration:
  diagnostics:
    name: Диагностика
    description: Настройка частоты обновления данных о состоянии контроллера.
    fields:
      carrier_monitoring_poll_interval_seconds:
        name: Интервал опроса, секунды
        description: Как часто обновляются данные о линиях питания, неисправностях питания и температуре платы.
      ste_heartbeat_on_seconds:
        name: Время свечения STE, секунды
        description: Как долго индикатор STE остаётся включённым в каждом цикле пульсации.
      ste_heartbeat_off_seconds:
        name: Время паузы STE, секунды
        description: Как долго индикатор STE остаётся выключенным в каждом цикле пульсации.
  onewire:
    name: 1-Wire
    description: Настройка опроса температурных датчиков на двух шинах 1-Wire.
    fields:
      bus1_poll_interval_seconds:
        name: Интервал опроса шины 1, секунды
        description: Как часто обновляются показания температурных датчиков на шине 1-Wire 1.
      bus2_poll_interval_seconds:
        name: Интервал опроса шины 2, секунды
        description: Как часто обновляются показания температурных датчиков на шине 1-Wire 2.
  rs485:
    name: RS-485
    description: Настройка интерфейсов RS-485.
    fields:
      enabled:
        name: Включено
        description: Включить интерфейсы RS-485.
  power_button:
    name: Кнопка питания
    description: Настройка корректного завершения работы хоста физической кнопкой питания.
    fields:
      shutdown_enabled:
        name: Завершение работы
        description: Разрешить корректное завершение работы хоста физической кнопкой питания.
      shutdown_hold_seconds:
        name: Время удержания, секунды
        description: Как долго нужно удерживать кнопку питания до начала завершения работы.
  buzzer:
    name: Зуммер
    description: Настройка звуковых уведомлений зуммера на GPIO18.
    fields:
      startup_enabled:
        name: Звук при запуске
        description: Подать короткий звуковой сигнал после запуска дополнения.
      shutdown_enabled:
        name: Звук при завершении работы
        description: Подать подтверждающий звуковой сигнал перед завершением работы хоста. Громкость сигнала фиксирована на уровне 80%.
      frequency:
        name: Частота, Гц
        description: Частота звуковых сигналов при запуске и завершении работы.
      duration_ms:
        name: Длительность, мс
        description: Длительность звуковых сигналов при запуске и завершении работы.
